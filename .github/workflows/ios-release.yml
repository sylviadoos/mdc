name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - Sylvia

jobs:
  build-and-upload:
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.app.mdccard
      TEAM_ID: SV8BSPZW63

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install signing certificate
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > certificate.p12

          security create-keychain \
            -p "github" \
            build.keychain

          security default-keychain \
            -s build.keychain

          security unlock-keychain \
            -p "github" \
            build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$IOS_P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "github" \
            build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          echo "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          echo "Using provisioning profile: $PROFILE_NAME"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

          # Scope manual signing to the Runner app target only (via the
          # xcconfig Runner itself includes). Passing CODE_SIGN_STYLE etc.
          # as xcodebuild command-line args instead would apply them to
          # every target in the build, including CocoaPods library
          # targets, which reject provisioning profiles outright.
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGNING_ALLOWED = YES
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = ${TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          echo "$APPSTORE_PRIVATE_KEY" \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          xcrun altool \
            --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"