workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter clean
      - name: Build iOS IPA
        script: cd ios
        script: pod repo update
        script: pod install

    artifacts:
      - build/ios/ipa/*.ipa
